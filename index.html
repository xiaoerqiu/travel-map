<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="中国及台湾地区著名旅游景点按月份推荐的三维互动地图，基于最新 Web 技术与高德地图实现优美的交互体验。" />
    <meta name="keywords" content="旅游地图, 高德地图, 景点推荐, 中国旅游, 台湾旅游, WebGIS" />
    <title>中国及台湾地区旅游景点按月推荐地图</title>
    <!-- 引入地图前置所需安全密钥配置（占位），请在测试时自行补齐 -->
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: 'YOUR_AMAP_SECURITY_CODE',
        }
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=YOUR_AMAP_KEY"></script>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <!-- 地图容器 -->
    <div id="map-container"></div>

    <!-- 信息浮层模板 (将在 JS 中动态复制和填充) -->
    <template id="info-card-template">
        <div class="glass-card info-card">
            <button class="close-btn">&times;</button>
            <div class="card-image-wrapper">
                <img src="" alt="景点图片" class="card-image" />
            </div>
            <div class="card-content">
                <h3 class="card-title"></h3>
                <p class="card-desc"></p>
            </div>
        </div>
    </template>

    <!-- 底部月份选择器 -->
    <div class="glass-panel timeline-container">
        <div class="timeline" id="timeline">
            <!-- JS 动态生成 1-12 月份 -->
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>

</html>
